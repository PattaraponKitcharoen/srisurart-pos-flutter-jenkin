# Lab 05 — throwaway stack for the Playwright suite: one api, Postgres, both Redis.
#
#   API_IMAGE=srisurart-e2e-api:<commit> E2E_PLATFORM_PASSWORD=<per-build random> \
#   docker compose -p <unique> --env-file server/.env.example -f e2e/docker-compose.e2e.yml up -d --wait
#
# Deliberately unlike server/docker-compose.yml:
#   - no bind mounts: the Jenkins agent is itself a container, so a path in its workspace
#     does not exist on the Docker host (the pos_app role is created by `db-init` instead
#     of docker/postgres/init/01-app-role.sh);
#   - no published ports and no fixed subnet: two builds can run side by side, and the
#     Playwright container joins the api container's network namespace (127.0.0.1:3000);
#   - no named volumes (datastores on tmpfs): `docker compose down` leaves nothing behind.
# Only .env.example's public dev-only values are used, hence ALLOW_DEV_SECRETS=true.

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pos"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Same role as docker/postgres/init/01-app-role.sh: RLS is only real if the app
  # connects as a role that is neither superuser nor table owner.
  db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - psql
      - -h
      - postgres
      - -U
      - postgres
      - -d
      - pos
      - -v
      - ON_ERROR_STOP=1
      - -c
      - CREATE ROLE pos_app LOGIN PASSWORD '${POS_APP_PASSWORD:?POS_APP_PASSWORD is required}' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS
      - -c
      - GRANT CONNECT ON DATABASE pos TO pos_app

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-queue:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    command: ["node", "dist/db/migrate.js", "up"]
    restart: "no"
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/pos

  api:
    image: ${API_IMAGE}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis-cache: { condition: service_healthy }
      redis-queue: { condition: service_healthy }
    environment:
      INSTANCE_ID: api-e2e  # must start with "api" — config.ts loads the JWT keys only then
      DB_POOL_SIZE: "5"
      LOG_LEVEL: warn
      ALLOW_DEV_SECRETS: "true"
      DATABASE_URL: postgres://pos_app:${POS_APP_PASSWORD}@postgres:5432/pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis-cache:6379
      REDIS_QUEUE_URL: redis://:${REDIS_PASSWORD}@redis-queue:6379
      JWT_PLATFORM_SECRET: ${JWT_PLATFORM_SECRET:?JWT_PLATFORM_SECRET is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:?JWT_PUBLIC_KEYS is required}
      # The suite provisions its own shop through the platform plane, which only answers
      # on loopback — reachable because Playwright shares this container's network.
      PLATFORM_ADMINS: e2e-admin:${E2E_PLATFORM_PASSWORD:?E2E_PLATFORM_PASSWORD is required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
