<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker></defs><rect width="1700" height="1080" fill="#ffffff"/><text x="850.0" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2933" text-anchor="middle">srisurart POS API — Lab 10 pipeline (Jenkinsfile, every stage on an ephemeral pod of the kind cluster)</text><text x="850.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#52606d" text-anchor="middle">⛔ = gate that stops the run    ·    solid arrows = order    ·    dashed boxes = services outside the pipeline</text><rect x="40" y="95" width="300" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="190.0" y="119" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">git push / merge to main</text><text x="190.0" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">GitHub fork → multibranch srisurart-api</text><line x1="340" y1="124" x2="400" y2="124" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="400" y="95" width="330" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="565.0" y="119" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Jenkins controller (agent none)</text><text x="565.0" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">schedules pods on cloud kind-srisurart (limit 3)</text><rect x="30" y="175" width="1640" height="470" rx="14" fill="#f0f7ff" stroke="#2b6cb0" stroke-width="2"/><text x="50" y="203" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2b6cb0" text-anchor="start">Pod 1 — build pod (ci/k8s/build-pod.yaml): node · gitleaks · semgrep · syft · cosign · opa · trivy · kaniko · crane</text><rect x="60" y="220" width="220" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="170.0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Install</text><text x="170.0" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">pnpm install --frozen-lockfile</text><line x1="280" y1="249" x2="320" y2="249" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="320" y="215" width="560" height="250" rx="10" fill="#ebf4ff" stroke="#4299e1" stroke-width="2" stroke-dasharray="6,4"/><text x="600" y="238" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Checks — parallel { failFast }</text><rect x="335" y="250" width="255" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="462.5" y="274" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Secrets</text><text x="462.5" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">gitleaks, history of HEAD</text><rect x="610" y="250" width="255" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="737.5" y="274" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Lint</text><text x="737.5" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">oxlint + tsc --noEmit</text><rect x="335" y="318" width="255" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="462.5" y="342" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Unit Test</text><text x="462.5" y="363" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">vitest + coverage + JUnit</text><rect x="610" y="318" width="255" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="737.5" y="342" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SAST — ESLint security</text><text x="737.5" y="363" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">SARIF, warnings only</text><rect x="335" y="386" width="255" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="462.5" y="410" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SAST — Semgrep</text><text x="462.5" y="431" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">owasp-top-ten + nodejs</text><rect x="610" y="386" width="255" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="737.5" y="410" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SCA — pnpm audit</text><text x="737.5" y="431" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">critical → red, Policy decides</text><line x1="880" y1="340" x2="920" y2="340" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="220" width="330" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="1085.0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SBOM</text><text x="1085.0" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">syft CycloneDX → cosign sign + verify → trivy sbom</text><line x1="1085" y1="278" x2="1085" y2="300" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="300" width="330" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="1085.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Policy Gate</text><text x="1085.0" y="345" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">OPA security.rego: no CRITICAL CVE</text><line x1="1085" y1="358" x2="1085" y2="380" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="380" width="330" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="1085.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SonarQube Analysis</text><text x="1085.0" y="425" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">@sonar/scan, token via withSonarQubeEnv</text><line x1="1085" y1="438" x2="1085" y2="460" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="920" y="460" width="330" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="1085.0" y="484" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Quality Gate</text><text x="1085.0" y="505" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">coverage ≥ 70% on unit-owned layers</text><polyline points="1250,489 1270,489 1270,249 1286,249" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="1290" y="220" width="350" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="1465.0" y="244" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Build Image</text><text x="1465.0" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">Kaniko → image.tar (no daemon, no push)</text><line x1="1465" y1="278" x2="1465" y2="300" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="1290" y="300" width="350" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="1465.0" y="324" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Container Scan</text><text x="1465.0" y="345" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">Trivy HIGH/CRITICAL on the tarball, SARIF</text><line x1="1465" y1="358" x2="1465" y2="380" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="1290" y="380" width="350" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="1465.0" y="404" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Push Image</text><text x="1465.0" y="425" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">crane → kind-registry:5000/srisurart-server:&lt;sha7&gt;</text><text x="1440" y="465" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#2b6cb0" text-anchor="middle">immutable tag = commit, never latest</text><text x="600" y="500" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#2b6cb0" text-anchor="middle">the first failing check interrupts the others (failFast)</text><text x="600" y="525" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">artifacts: gitleaks JSON · SARIF · audit.json · SBOM + .sig · trivy SARIF · JUnit · coverage</text><text x="850" y="620" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">tool containers run as uid 1000 (HOME=/tmp); only Kaniko and Trivy run as root · Trivy DB cached on the kind node</text><line x1="1600" y1="438" x2="1600" y2="680" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="1080" y="680" width="590" height="150" rx="14" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/><text x="1100" y="708" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2f855a" text-anchor="start">Pod 2 — E2E pod (image = the one just pushed)</text><rect x="1100" y="725" width="550" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="1375.0" y="749" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ E2E</text><text x="1375.0" y="770" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">postgres · redis ×2 · api(&lt;sha7&gt;) · node share 127.0.0.1 → Playwright 7 specs</text><text x="1375" y="812" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">migrations + pos_app role (RLS) first; random platform-admin password per run</text><line x1="1080" y1="760" x2="1010" y2="760" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="680" width="980" height="240" rx="14" fill="#fffaf0" stroke="#c05621" stroke-width="2"/><text x="50" y="708" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#c05621" text-anchor="start">Pod 3 — deploy pod, main only (ci/k8s/deploy-pod.yaml: node + kubectl)</text><rect x="620" y="725" width="370" height="60" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="805.0" y="749" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Pipeline Health Gate</text><text x="805.0" y="770" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">Prometheus: last 20 runs ≥ 90% SUCCESS</text><line x1="620" y1="755" x2="560" y2="755" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="60" y="725" width="500" height="60" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="310.0" y="749" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Deploy — Production (blue/green)</text><text x="310.0" y="770" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">bootstrap → set image on idle colour → rollout status</text><rect x="60" y="800" width="240" height="58" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/><text x="180.0" y="824" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#9b2c2c" text-anchor="middle">⛔ Smoke test</text><text x="180.0" y="845" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">curl /health/ready of new colour</text><line x1="300" y1="829" x2="340" y2="829" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/><rect x="340" y="800" width="220" height="58" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="2"/><text x="450.0" y="824" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Switch Service</text><text x="450.0" y="845" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">selector color → new</text><text x="800" y="830" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#c53030" text-anchor="middle">post failure → automatic rollback:</text><text x="800" y="852" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#c53030" text-anchor="middle">Service back to old colour + rollout undo</text><text x="800" y="895" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#52606d" text-anchor="middle">kubeconfig only via withCredentials(kind-kubeconfig)</text><rect x="30" y="945" width="420" height="110" rx="14" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/><text x="240" y="975" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6b46c1" text-anchor="middle">post { success / unsuccessful }</text><text x="240" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">mail → mailpit:1025 (inbox 127.0.0.1:8025)</text><text x="240" y="1025" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1f2933" text-anchor="middle">subject: result, stage, branch · body: build URL</text><rect x="480" y="945" width="280" height="110" rx="12" fill="#ffffff" stroke="#7b8794" stroke-width="2" stroke-dasharray="6,4"/><text x="620" y="985" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">SonarQube</text><text x="620" y="1012" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">sonarqube:9000 + webhook</text><rect x="780" y="945" width="280" height="110" rx="12" fill="#ffffff" stroke="#7b8794" stroke-width="2" stroke-dasharray="6,4"/><text x="920" y="985" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">kind-registry</text><text x="920" y="1012" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">localhost:5001 mirror</text><rect x="1080" y="945" width="280" height="110" rx="12" fill="#ffffff" stroke="#7b8794" stroke-width="2" stroke-dasharray="6,4"/><text x="1220" y="985" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Prometheus + Grafana</text><text x="1220" y="1012" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">Lab 09, alert JenkinsQueueBacklog</text><rect x="1380" y="945" width="280" height="110" rx="12" fill="#ffffff" stroke="#7b8794" stroke-width="2" stroke-dasharray="6,4"/><text x="1520" y="985" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2933" text-anchor="middle">Jenkins credentials</text><text x="1520" y="1012" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">sonar-token · cosign · kind-kubeconfig</text></svg>