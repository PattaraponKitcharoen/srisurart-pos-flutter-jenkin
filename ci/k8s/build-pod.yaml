# Lab 10 — the build pod: one ephemeral pod per run, one container per tool, all sharing the
# workspace volume the Kubernetes plugin mounts at /home/jenkins/agent. Nothing here needs the
# Docker socket: images are built by Kaniko, scanned from a tarball and pushed with crane.
# Tools run as uid 1000 (the jnlp/workspace owner) with HOME=/tmp, like Lab 06's runTool;
# only Kaniko (unpacks image layers) and Trivy (shared DB cache) run as root.
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: srisurart-ci
spec:
  securityContext:
    fsGroup: 1000
  volumes:
    - name: trivy-cache          # Trivy's vulnerability DB, kept on the kind node between runs
      hostPath:
        path: /var/cache/ci/trivy
        type: DirectoryOrCreate
  containers:
    - name: jnlp
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {memory: 768Mi}      # Lab 09: the default limit was OOMKilled under load
    - name: node
      image: node:22-bookworm-slim
      command: [cat]
      tty: true
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      env:
        - {name: HOME, value: /tmp}
        - {name: COREPACK_ENABLE_DOWNLOAD_PROMPT, value: "0"}
      resources:
        requests: {cpu: "2", memory: 2Gi}   # lint, unit, ESLint and audit run here in parallel
        limits: {memory: 4Gi}
    - name: gitleaks
      image: zricethezav/gitleaks:v8.30.1
      command: [cat]
      tty: true
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      env: [{name: HOME, value: /tmp}]
    - name: semgrep
      image: semgrep/semgrep:1.177.0
      command: [cat]
      tty: true
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      env: [{name: HOME, value: /tmp}]
      resources:
        limits: {memory: 1536Mi}
    - name: syft
      image: anchore/syft:v1.52.0-debug
      command: [/busybox/cat]
      tty: true
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      env: [{name: HOME, value: /tmp}]
    - name: cosign
      image: gcr.io/projectsigstore/cosign:v2.6.1-dev
      command: [cat]
      tty: true
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      env: [{name: HOME, value: /tmp}]
    - name: opa
      image: openpolicyagent/opa:1.21.0-debug
      command: [cat]
      tty: true
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
    - name: trivy
      image: aquasec/trivy:0.74.0
      command: [cat]
      tty: true
      volumeMounts:
        - {name: trivy-cache, mountPath: /cache/trivy}
    - name: kaniko
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
      command: [/busybox/cat]
      tty: true
      resources:
        requests: {cpu: 500m, memory: 512Mi}
        limits: {memory: 2Gi}
    - name: crane
      image: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
      command: [/busybox/cat]
      tty: true
      securityContext: {runAsUser: 1000, runAsGroup: 1000}
      env: [{name: HOME, value: /tmp}]
