# Lab 05 — SonarQube analysis of the NestJS server (run from server/ by the Jenkinsfile).
# Host URL and token come from withSonarQubeEnv('SonarQube'), never from this file.
sonar.projectKey=srisurart-pos-server
sonar.projectName=srisurart-pos-server
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=src/**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Written by `vitest run --coverage` (vitest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The coverage gate measures what the UNIT suite owns: auth, platform, common, config,
# queue, rate-limit, infra, backup, cli, audit, metrics. Everything below is exercised by
# the e2e suite (test/*.e2e-spec.ts) against a real Postgres with RLS instead — business
# modules whose logic is SQL, migrations, Nest wiring (modules/controllers) and process
# entry points — so unit coverage there would be 0-40% by design, not by neglect.
sonar.coverage.exclusions=\
  src/db/**,\
  src/main.ts,src/worker.ts,src/bull-board.ts,\
  src/**/*.module.ts,src/**/*.controller.ts,src/**/*.controllers.ts,\
  src/sales/**,src/sync/**,src/products/**,src/returns/**,src/quotes/**,\
  src/mechanics/**,src/purchasing/**,src/shifts/**,src/settings/**,src/customers/**,\
  src/reports/**,src/idempotency/**,src/documents/**,src/devices/**,\
  src/review-items/**,src/people/**,src/parked-sales/**
